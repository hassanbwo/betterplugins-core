name: Build

# Builds the plugin and runs all tests for every pull request and every push to the main branch
# (only once per change). The plugin jar can be downloaded from the run (Artifacts).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload the library jar
        uses: actions/upload-artifact@v5
        with:
          name: jar
          path: |
            target/*.jar
            !target/original-*.jar
