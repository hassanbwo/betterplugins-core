name: Build

# Builds the plugin and runs all tests on every push and pull request.
# The plugin jar can be downloaded from the run (Artifacts).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload the library jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: |
            target/*.jar
            !target/original-*.jar
