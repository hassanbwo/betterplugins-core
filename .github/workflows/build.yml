name: Build

# Builds the plugin and runs all tests for every pull request and every push to the main branch
# (only once per change). The plugin jar can be downloaded from the run (Artifacts).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload the library jar
        uses: actions/upload-artifact@v5
        with:
          name: jar
          path: |
            target/*.jar
            !target/original-*.jar

  # After a successful build on main: create the git tag for the version in pom.xml (e.g. 1.0.0),
  # JitPack builds the library from that tag. Nothing happens if the tag already exists.
  tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag the version from pom.xml
        run: |
          version=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists"
          else
            git tag "$version"
            git push origin "$version"
            echo "Created tag $version"
          fi
